<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>PrintOS — opções</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        max-width: 420px;
        margin: 28px auto;
        padding: 0 18px;
        color: #0b1b3a;
      }
      h1 { font-size: 17px; }
      p { font-size: 13px; color: #55657f; }
      label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #64748b; margin: 14px 0 5px; }
      input {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid #d8e1ef;
        border-radius: 10px;
        font-size: 14px;
      }
      button {
        margin-top: 16px;
        padding: 10px 18px;
        border: 0;
        border-radius: 10px;
        background: #175bff;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      .msg { margin-top: 10px; font-size: 13px; }
      .ok { color: #0f7a45; }
      .err { color: #dc2626; }
    </style>
  </head>
  <body>
    <h1>PrintOS — extensão do WhatsApp</h1>
    <p>
      Gere o token em <strong>PrintOS → Configurações → Extensão do WhatsApp Web</strong> e cole
      aqui junto com o endereço do seu PrintOS.
    </p>
    <label for="url">URL do PrintOS</label>
    <input id="url" placeholder="https://app.suagrafica.com.br" />
    <label for="token">Token</label>
    <input id="token" placeholder="pit_..." />
    <button id="salvar" type="button">Salvar</button>
    <p class="msg" id="msg"></p>
    <script src="options.js"></script>
  </body>
</html>
