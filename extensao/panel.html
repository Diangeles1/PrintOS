<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Novo pedido · PrintOS</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f5f7fb;
        color: #0b1b3a;
        font-size: 14px;
      }
      .wrap { padding: 18px; }
      h1 { margin: 0 0 4px; font-size: 17px; font-weight: 800; }
      .sub { margin: 0 0 16px; font-size: 12.5px; color: #64748b; }
      label { display: block; margin-bottom: 12px; }
      .lbl {
        display: block;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #64748b;
        margin-bottom: 5px;
      }
      input, textarea, select {
        width: 100%;
        border: 1px solid #d8e1ef;
        border-radius: 10px;
        padding: 9px 12px;
        font: inherit;
        color: #0b1b3a;
        outline: none;
        background: #fff;
      }
      .dois { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      input:focus, textarea:focus, select:focus {
        border-color: #175bff;
        box-shadow: 0 0 0 3px rgba(23, 91, 255, 0.13);
      }
      textarea { resize: vertical; }
      .itens { display: flex; flex-direction: column; gap: 8px; }
      .item { display: grid; grid-template-columns: 1fr 64px 28px; gap: 6px; }
      .item button {
        border: 1px solid #d8e1ef;
        border-radius: 8px;
        background: #fff;
        color: #b42318;
        cursor: pointer;
      }
      .add {
        border: 1px dashed #cdd9ea;
        background: #fff;
        color: #175bff;
        border-radius: 8px;
        padding: 7px 0;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        margin-top: 6px;
      }
      .arte { margin-bottom: 14px; }
      .arte-info { font-size: 12px; color: #64748b; margin: 0 0 7px; }
      .imgs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .imgpick {
        position: relative;
        border: 2px solid #d8e1ef;
        border-radius: 10px;
        overflow: hidden;
        background: #fff;
        cursor: pointer;
        padding: 0;
        aspect-ratio: 1 / 1;
      }
      .imgpick img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .imgpick.on { border-color: #175bff; box-shadow: 0 0 0 3px rgba(23, 91, 255, 0.16); }
      .imgpick .tick {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #175bff;
        color: #fff;
        font-size: 13px;
        font-weight: 800;
        display: none;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }
      .imgpick.on .tick { display: flex; }
      .arte-vazio {
        font-size: 12.5px;
        color: #8a97ad;
        background: #fff;
        border: 1px dashed #d8e1ef;
        border-radius: 10px;
        padding: 12px;
        text-align: center;
      }
      .acoes { display: flex; gap: 8px; margin-top: 8px; }
      .btn {
        flex: 1;
        border: 0;
        border-radius: 10px;
        padding: 11px 0;
        font-weight: 700;
        cursor: pointer;
        font: inherit;
      }
      .btn.primary { background: #175bff; color: #fff; }
      .btn.primary:disabled { background: #a7bff5; cursor: default; }
      .btn.ghost { background: #fff; border: 1px solid #cdd9ea; color: #175bff; }
      .msg { margin-top: 12px; font-size: 13px; }
      .msg.ok { color: #0f7a45; }
      .msg.err { color: #dc2626; }
      details { margin-bottom: 12px; }
      summary { font-size: 12px; color: #64748b; cursor: pointer; }
      pre {
        white-space: pre-wrap;
        font: inherit;
        background: #fff;
        border: 1px solid #e4eaf3;
        border-radius: 8px;
        padding: 8px 10px;
        margin: 6px 0 0;
        max-height: 120px;
        overflow: auto;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Novo pedido</h1>
      <p class="sub">Preencha o que for do pedido e envie pro PrintOS (entra como “aguardando arte”).</p>

      <label>
        <span class="lbl">Cliente</span>
        <input id="cliente" placeholder="Nome do cliente" />
      </label>

      <div class="arte">
        <span class="lbl">Arte do cliente</span>
        <p class="arte-info" id="arte-info">Procurando imagens na conversa…</p>
        <div class="imgs" id="imgs"></div>
      </div>

      <span class="lbl">O que é</span>
      <div class="itens" id="itens"></div>
      <button class="add" id="add" type="button">+ item</button>

      <div class="dois" style="margin-top: 12px">
        <label>
          <span class="lbl">Valor (R$)</span>
          <input id="valor" type="number" min="0" step="0.01" placeholder="0,00" />
        </label>
        <label>
          <span class="lbl">Prazo</span>
          <input id="prazo" type="date" />
        </label>
      </div>

      <label>
        <span class="lbl">Forma de pagamento</span>
        <select id="forma">
          <option value="">Não informar</option>
          <option value="dinheiro">Dinheiro</option>
          <option value="pix">Pix</option>
          <option value="debito">Débito</option>
          <option value="credito">Crédito</option>
          <option value="outro">Outro</option>
        </select>
      </label>

      <label>
        <span class="lbl">Observações</span>
        <textarea id="obs" rows="2" placeholder="Acabamento, detalhes…"></textarea>
      </label>

      <details>
        <summary>Conversa capturada</summary>
        <pre id="conversa"></pre>
      </details>

      <div class="acoes">
        <button class="btn ghost" id="cancelar" type="button">Cancelar</button>
        <button class="btn primary" id="criar" type="button">Criar pedido</button>
      </div>
      <p class="msg" id="msg"></p>
    </div>
    <script src="panel.js"></script>
  </body>
</html>
